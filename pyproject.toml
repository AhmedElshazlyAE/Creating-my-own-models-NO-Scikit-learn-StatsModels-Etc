[project]
name = "simpleML"
version = "0.1.0"
description = "A NumPy-based educational machine learning library built from scratch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy","pandas"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"